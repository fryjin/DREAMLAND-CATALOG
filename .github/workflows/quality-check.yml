name: Project quality checks

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-check:
    name: quality-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      # Direct pushes to develop may be followed by the generated-data sync
      # workflow. PRs and main must always be fully synchronized.
      - name: Check generated product fallback
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
        run: npm run data:check

      - name: Validate project
        run: npm run validate
