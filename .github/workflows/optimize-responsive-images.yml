name: Optimize responsive images

on:
  workflow_dispatch:

  push:
    branches:
      - develop
    paths:
      - '.github/workflows/optimize-responsive-images.yml'
      - 'scripts/apply-data-fixes.mjs'
      - 'scripts/generate-responsive-images.mjs'
      - 'images/products/**'
      - 'images/shared/**'
      - 'images/patterns/**'
      - 'images/packages/**'

permissions:
  contents: write

concurrency:
  group: optimize-responsive-images-develop
  cancel-in-progress: true

jobs:
  optimize:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.ref_name == 'develop'

    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout develop branch
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Sharp
        run: npm install --no-save --no-audit --no-fund sharp@0.35.3

      - name: Apply catalog data fixes
        run: node scripts/apply-data-fixes.mjs

      - name: Generate responsive WebP images
        run: node scripts/generate-responsive-images.mjs

      - name: Commit generated assets to develop
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add             data/products.csv             data/products.json             data/image-optimization-report.json             images/generated

          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi

          git commit -m "perf: generate responsive images"
          git push origin HEAD:develop
