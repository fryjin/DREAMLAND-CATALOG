name: Optimize responsive images

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - develop
    paths:
      - '.github/workflows/optimize-responsive-images.yml'
      - 'scripts/apply-data-fixes.mjs'
      - 'scripts/generate-responsive-images.mjs'
      - 'images/products/**'
      - 'images/shared/**'
      - 'images/patterns/**'
      - 'images/packages/**'

permissions:
  contents: write

jobs:
  optimize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Sharp
        run: npm install --no-save --no-audit --no-fund sharp@0.35.3

      - name: Apply catalog data fixes
        run: node scripts/apply-data-fixes.mjs

      - name: Generate responsive WebP images
        run: node scripts/generate-responsive-images.mjs

      - name: Commit generated assets
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/products.csv data/products.json data/image-optimization-report.json images/generated
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git commit -m "perf: generate responsive product images"
          git push origin "HEAD:${GITHUB_REF_NAME}"
